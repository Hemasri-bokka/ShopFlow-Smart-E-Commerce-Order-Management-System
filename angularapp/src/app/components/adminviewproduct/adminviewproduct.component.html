<div>
    <select [(ngModel)]="selectedCategory" (change)="filterProducts()">
        <option *ngFor="let cat of categories">{{ cat }}</option>
    </select>
</div>

<div *ngIf="products.length === 0" class="no-products">
    Oops! No Products Found.
</div>

<div class="grid">
    <div class="card" *ngFor="let product of filteredProducts">
        <img [src]="product.photoImage || 'assets/default-image.png'" alt="{{ product.name }}" />
        <h3>{{ product.name }}</h3>
        <p>{{ product.description }}</p>
        <p><strong>Price:</strong> ₹{{ product.price }}</p>
        <p><strong>Stock:</strong> {{ product.stock }}</p>
        <p><strong>Category:</strong> {{ product.category }}</p>
        <p><strong>Created:</strong> {{ product.createdAt | date:'short' }}</p>
        <p><strong>Updated:</strong> {{ product.UpdatedAt | date:'short' }}</p>
        <p *ngIf="product.user"><strong>Added by:</strong> {{ product.user.name }}</p>
        <button (click)="editProduct(product.productId)">Edit</button>
        <button (click)="deleteProduct(product.productId)">Delete</button>
    </div> 
</div>
